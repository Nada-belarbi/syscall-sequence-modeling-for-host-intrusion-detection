name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch to keep the runner fast
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.7.1 \
                      matplotlib==3.10.0 seaborn==0.13.2 pyarrow==21.0.0 \
                      pyyaml==6.0.2 tqdm==4.67.1 scipy==1.13.1
          pip install pytest pytest-cov ruff black pip-audit

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (black)
        run: black --check src tests scripts

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=src.metrics \
            --cov=src.datasets \
            --cov=src.lstm_model \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Security audit (pip-audit)
        if: matrix.python-version == '3.11'
        run: pip-audit -r requirements.txt
